[project]
name = "minty-investing"
version = "0.1.0"
description = "Minty Investing — local-first research & portfolio-monitoring tool for Indian retail equity investors (MaverIQ AI)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.6.0,<2",
    "httpx>=0.28",
    "pandas>=2.2",
    "yfinance>=1.2.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.2.126,<0.3",
    "pyyaml>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
minty = "engine.interactive:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only `engine/` is an importable package (see the pytest comment below) —
# `mcp/`, `ingest/`, `skills/`, etc. are invoked as scripts or read as data
# via repo-relative paths, never imported, so they don't belong in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live external APIs; run deliberately with -m network"]
addopts = "-m 'not network'"
# engine/ is a real package (unlike mcp/<name>/server.py, which each need
# importlib workarounds to avoid module-name collisions) — this just needs
# repo root on sys.path so `from engine import ...` resolves under pytest.
pythonpath = ["."]
